# Only the Caddy container's exact address is trusted for client identity.
# Keep this IP in sync with deploy/compose.https.yml if changing its subnet.
map $realip_remote_addr $linkforge_public_scheme {
    default $scheme;
    172.30.0.2 $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;
    client_max_body_size 32k;

    set_real_ip_from 172.30.0.2;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $linkforge_public_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ { proxy_pass http://api:8000; }
    location /r/ { proxy_pass http://api:8000; }
    location /health/ { proxy_pass http://api:8000; }
    location /docs { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }
    location = /metrics { return 404; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
