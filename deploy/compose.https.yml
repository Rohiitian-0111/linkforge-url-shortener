# From the repository root:
# docker compose -f docker-compose.yml -f deploy/compose.https.yml up --build -d
# Set FRONTEND_BIND=127.0.0.1, DOMAIN, TLS_EMAIL and HTTPS URL/hosts in .env first.

services:
  frontend:
    volumes:
      - ./deploy/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      private: {}
      public_proxy: {}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your hostname for HTTPS}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL for certificate account notices}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
    networks:
      public_proxy:
        ipv4_address: 172.30.0.2

networks:
  public_proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

volumes:
  caddy_data:
  caddy_config:
