[project]
name = "linkforge-backend"
version = "1.0.0"
description = "URL shortening with PostgreSQL, Redis and replay-safe analytics"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires live PostgreSQL and Redis"]

[tool.ruff]
line-length = 120
target-version = "py311"
