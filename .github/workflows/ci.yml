name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest tests -q
      - name: Verify migrations on SQLite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./migration-check.db
          REDIS_URL: ""
          ANALYTICS_MODE: inline
          RATE_LIMIT_ENABLED: "false"
        run: |
          alembic upgrade head
          alembic check

  services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linkforge
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: linkforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linkforge -d linkforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUN_INTEGRATION: "1"
      TEST_DATABASE_URL: postgresql+asyncpg://linkforge:ci-test-password@localhost:5432/linkforge_test
      TEST_REDIS_URL: redis://localhost:6379/15
      ENVIRONMENT: test
      JWT_SECRET: ci-only-test-secret-not-used-outside-ci-123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+asyncpg://linkforge:ci-test-password@localhost:5432/linkforge_test
          REDIS_URL: redis://localhost:6379/15
        run: |
          alembic upgrade head
          alembic check
      - run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/setup.py
      - run: docker compose config --quiet
